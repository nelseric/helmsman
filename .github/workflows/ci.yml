name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Package
        run: scripts/package.sh "0.0.${{ github.run_number }}"

      # Unzip into the Valheim folder, like a release.
      - uses: actions/upload-artifact@v7
        with:
          name: Helmsman
          path: dist/
