name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          # BepInEx requires a plain numeric version (System.Version), so no pre-release suffixes.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must look like v1.2.3, got $GITHUB_REF_NAME"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test -c Release

      - name: Build plugin
        run: dotnet build src/Helmsman -c Release -p:Version="$VERSION"

      - name: Package
        run: |
          dest=dist/BepInEx/plugins/Helmsman
          mkdir -p "$dest"
          cp src/Helmsman/bin/Release/netstandard2.1/Helmsman.dll README.md LICENSE "$dest/"
          (cd dist && zip -r "../Helmsman-$VERSION.zip" BepInEx)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Helmsman-$VERSION.zip" --title "Helmsman $VERSION" --generate-notes
